<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <!-- Khung hiển thị ảnh lớn & dòng chữ chính -->
    <div id="image">
        Hover over an image below to display here.
    </div>

    <!-- Danh sách các ảnh nhỏ bên dưới -->
    <img class="preview" alt="Stylized Globe" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388627/globe.jpg"
        onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Abstract Lines" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388627/abstract.jpg"
        onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Colorful Geometric Shapes"
        src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388627/shapes.jpg" onmouseover="upDate(this)"
        onmouseout="unDo()">

</body>

</html>
